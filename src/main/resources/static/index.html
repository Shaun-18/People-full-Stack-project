<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>



</head>
<body>

<div class="container">
    <form class="peopleform" id="peopleform">
        <h2>Full Stack Developers</h2>
        <p class="subtitle">Please enter your details below</p>

        <div class="form-group">
            <label for="name">Name</label>
            <input class="name" type="text" id="name"
                   name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input class="email" type="email" id="email"
                   name="email" placeholder="Enter your email" required>
        </div>

        <button class="btnsubmit" type="submit">Submit</button>
    </form>
</div>

</body>
</html>
